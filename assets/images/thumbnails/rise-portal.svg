<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171435"/>
      <stop offset="50%" stop-color="#252054"/>
      <stop offset="100%" stop-color="#0c0921"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgRise)"/>

  <!-- Mockup Window -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="700" height="370" rx="16" fill="#100d2b" stroke="#4f46e5" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="50" y="40" width="700" height="44" rx="16" fill="#1e1b4b"/>
    <rect x="50" y="68" width="700" height="16" fill="#1e1b4b"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="124" cy="62" r="6" fill="#10b981"/>
    
    <text x="400" y="67" fill="#a5b4fc" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle" font-weight="600">
      Rise Association Portal • Member &amp; Event Management (TypeScript)
    </text>

    <!-- Portal Nav Sidebar -->
    <g transform="translate(80, 105)">
      <rect width="180" height="275" rx="12" fill="#18153b" stroke="#312e81" stroke-width="1"/>
      <text x="20" y="35" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">RISE Portal</text>
      
      <rect x="15" y="55" width="150" height="32" rx="8" fill="#4338ca"/>
      <text x="35" y="76" fill="#fff" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">📊 Dashboard</text>

      <rect x="15" y="95" width="150" height="32" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="35" y="116" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="12">👥 Members (240)</text>

      <rect x="15" y="135" width="150" height="32" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="35" y="156" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="12">📅 Events &amp; Fests</text>

      <rect x="15" y="175" width="150" height="32" rx="8" fill="rgba(255,255,255,0.03)"/>
      <text x="35" y="196" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="12">📢 Notices Hub</text>
    </g>

    <!-- Main Content Feed -->
    <g transform="translate(280, 105)">
      <rect width="440" height="130" rx="12" fill="#18153b" stroke="#3730a3" stroke-width="1"/>
      <text x="25" y="32" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">Annual Tech Symposium 2026</text>
      <text x="25" y="54" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="12">Published by Association Secretary • 240 RSVPs Confirmed</text>
      
      <rect x="25" y="75" width="130" height="34" rx="8" fill="#4f46e5"/>
      <text x="90" y="97" fill="#fff" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Register Member</text>
    </g>

    <g transform="translate(280, 250)">
      <rect width="440" height="130" rx="12" fill="#18153b" stroke="#3730a3" stroke-width="1"/>
      <text x="25" y="32" fill="#c7d2fe" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">Executive Committee Polls</text>
      <text x="25" y="54" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="12">Active Ballot Voting Closes Tonight at 11:59 PM</text>
      
      <rect x="25" y="75" width="130" height="34" rx="8" fill="#10b981"/>
      <text x="90" y="97" fill="#fff" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Cast Ballot</text>
    </g>
  </g>
</svg>
