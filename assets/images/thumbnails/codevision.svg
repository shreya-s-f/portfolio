<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062820"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgCode)"/>

  <!-- Mockup Window -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="700" height="370" rx="16" fill="#061f18" stroke="#047857" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="50" y="40" width="700" height="44" rx="16" fill="#093529"/>
    <rect x="50" y="68" width="700" height="16" fill="#093529"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="124" cy="62" r="6" fill="#10b981"/>
    
    <text x="400" y="67" fill="#6ee7b7" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle" font-weight="600">
      CodeVision.ai — AI Code Review Assistant (Project 22UIS717P)
    </text>

    <!-- Left Editor -->
    <g transform="translate(80, 105)">
      <rect width="360" height="275" rx="10" fill="#031410" stroke="#064e3b" stroke-width="1.5"/>
      <text x="25" y="32" fill="#64748b" font-family="'Fira Code', monospace" font-size="12">1</text>
      <text x="50" y="32" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="12">function <tspan fill="#38bdf8">analyzeSecurity</tspan>(req, res) {</text>

      <text x="25" y="60" fill="#64748b" font-family="'Fira Code', monospace" font-size="12">2</text>
      <text x="50" y="60" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="12">  const <tspan fill="#f1f5f9">query = req.body.input;</tspan></text>

      <text x="25" y="88" fill="#64748b" font-family="'Fira Code', monospace" font-size="12">3</text>
      <rect x="45" y="73" width="290" height="22" rx="4" fill="rgba(239, 68, 68, 0.25)"/>
      <text x="50" y="88" fill="#f87171" font-family="'Fira Code', monospace" font-size="12">  db.raw(`SELECT * FROM users`); // SQLi Risk</text>

      <text x="25" y="116" fill="#64748b" font-family="'Fira Code', monospace" font-size="12">4</text>
      <text x="50" y="116" fill="#34d399" font-family="'Fira Code', monospace" font-size="12">  return <tspan fill="#f1f5f9">sanitize(query);</tspan></text>

      <text x="25" y="144" fill="#64748b" font-family="'Fira Code', monospace" font-size="12">5</text>
      <text x="50" y="144" fill="#f43f5e" font-family="'Fira Code', monospace" font-size="12">}</text>

      <rect x="25" y="195" width="310" height="55" rx="8" fill="#093529"/>
      <text x="40" y="222" fill="#34d399" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">✓ AI AST Scanner Active</text>
      <text x="40" y="240" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">Rule: CWE-89 SQL Injection Check</text>
    </g>

    <!-- Right Review Panel -->
    <g transform="translate(460, 105)">
      <rect width="260" height="275" rx="10" fill="#031410" stroke="#047857" stroke-width="1.5"/>
      <text x="25" y="35" fill="#34d399" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">AI Review Audit</text>

      <rect x="20" y="55" width="220" height="70" rx="8" fill="#0f2b23" stroke="#f59e0b" stroke-width="1"/>
      <text x="32" y="80" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">⚠ Severity: Medium</text>
      <text x="32" y="102" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Raw query vulnerability detected.</text>
      <text x="32" y="116" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Use parameterized inputs.</text>

      <rect x="20" y="138" width="220" height="60" rx="8" fill="#0f2b23" stroke="#10b981" stroke-width="1"/>
      <text x="32" y="162" fill="#34d399" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">✓ Code Quality: 94%</text>
      <text x="32" y="184" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Time complexity: O(1) optimal</text>

      <rect x="20" y="215" width="220" height="40" rx="8" fill="#059669"/>
      <text x="130" y="240" fill="#fff" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Apply AI Patch</text>
    </g>
  </g>
</svg>
