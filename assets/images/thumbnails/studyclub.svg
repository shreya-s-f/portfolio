<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStudy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#2d1254"/>
      <stop offset="100%" stop-color="#130924"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d70"/>
      <stop offset="100%" stop-color="#1f103c"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgStudy)"/>

  <!-- Mockup Window -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="700" height="370" rx="16" fill="#130b24" stroke="#3b1d70" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="50" y="40" width="700" height="44" rx="16" fill="#241242"/>
    <rect x="50" y="68" width="700" height="16" fill="#241242"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="124" cy="62" r="6" fill="#10b981"/>
    
    <text x="400" y="67" fill="#c084fc" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle" font-weight="600">
      StudyClub AI • Collaborative Virtual Study Room #7142
    </text>

    <!-- Left: Pomodoro Timer Card -->
    <g transform="translate(80, 110)">
      <rect width="210" height="260" rx="12" fill="url(#cardGrad)" stroke="#581c87" stroke-width="1.5"/>
      <text x="105" y="40" fill="#e9d5ff" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Pomodoro Focus</text>
      
      <!-- Circular Progress Ring -->
      <circle cx="105" cy="125" r="54" fill="none" stroke="#3b1d70" stroke-width="8"/>
      <circle cx="105" cy="125" r="54" fill="none" stroke="url(#geminiGrad)" stroke-width="8" stroke-dasharray="339" stroke-dashoffset="85" stroke-linecap="round"/>
      <text x="105" y="133" fill="#ffffff" font-family="'Fira Code', monospace" font-size="22" font-weight="bold" text-anchor="middle">24:52</text>
      
      <rect x="45" y="205" width="120" height="32" rx="16" fill="#7c3aed"/>
      <text x="105" y="226" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Rain &amp; Lo-Fi ♫</text>
    </g>

    <!-- Center: AI Flashcards Generated by Gemini -->
    <g transform="translate(320, 110)">
      <rect width="240" height="260" rx="12" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1.5"/>
      
      <!-- Gemini Badge -->
      <rect x="20" y="20" width="115" height="26" rx="13" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1"/>
      <text x="77" y="37" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" text-anchor="middle">✨ Gemini AI</text>
      
      <rect x="20" y="65" width="200" height="120" rx="10" fill="#241242" stroke="#4c1d95" stroke-width="1"/>
      <text x="35" y="95" fill="#f3e8ff" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">Q: What is Overfitting?</text>
      <text x="35" y="125" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="12">AI Summary:</text>
      <text x="35" y="145" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Model memorizes noise instead</text>
      <text x="35" y="162" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">of general patterns.</text>
      
      <rect x="20" y="205" width="95" height="30" rx="8" fill="#10b981" opacity="0.8"/>
      <text x="67" y="225" fill="#fff" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Easy (1)</text>

      <rect x="125" y="205" width="95" height="30" rx="8" fill="#ef4444" opacity="0.8"/>
      <text x="172" y="225" fill="#fff" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Hard (2)</text>
    </g>

    <!-- Right: Collaborative Live Study Members -->
    <g transform="translate(585, 110)">
      <rect width="135" height="260" rx="12" fill="url(#cardGrad)" stroke="#581c87" stroke-width="1.5"/>
      <text x="67" y="32" fill="#e9d5ff" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Peer Room (4)</text>

      <g transform="translate(18, 55)">
        <circle cx="16" cy="16" r="16" fill="#a855f7"/>
        <text x="16" y="21" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">SF</text>
        <circle cx="28" cy="28" r="4" fill="#10b981"/>
        <text x="42" y="21" fill="#f8fafc" font-size="12" font-family="sans-serif">Shreya</text>
      </g>

      <g transform="translate(18, 105)">
        <circle cx="16" cy="16" r="16" fill="#06b6d4"/>
        <text x="16" y="21" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">RK</text>
        <circle cx="28" cy="28" r="4" fill="#10b981"/>
        <text x="42" y="21" fill="#f8fafc" font-size="12" font-family="sans-serif">Rohan</text>
      </g>

      <g transform="translate(18, 155)">
        <circle cx="16" cy="16" r="16" fill="#ec4899"/>
        <text x="16" y="21" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">AN</text>
        <circle cx="28" cy="28" r="4" fill="#10b981"/>
        <text x="42" y="21" fill="#f8fafc" font-size="12" font-family="sans-serif">Ananya</text>
      </g>

      <rect x="15" y="212" width="105" height="26" rx="13" fill="#1e293b"/>
      <text x="67" y="229" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Supabase Live</text>
    </g>
  </g>
</svg>
