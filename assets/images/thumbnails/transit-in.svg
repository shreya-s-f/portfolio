<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTransit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#031d2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgTransit)"/>

  <!-- Mockup Window -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="700" height="370" rx="16" fill="#042033" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="50" y="40" width="700" height="44" rx="16" fill="#0b3857"/>
    <rect x="50" y="68" width="700" height="16" fill="#0b3857"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="124" cy="62" r="6" fill="#10b981"/>
    
    <text x="400" y="67" fill="#7dd3fc" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle" font-weight="600">
      Transit.IN — Smart Public Transport GPS Tracker (Leaflet.js)
    </text>

    <!-- Map Canvas Simulation -->
    <g transform="translate(80, 105)">
      <rect width="420" height="275" rx="12" fill="#031826" stroke="#075985" stroke-width="1.5"/>
      
      <!-- Roads -->
      <path d="M 20 220 Q 120 180 220 200 T 400 120" fill="none" stroke="#0284c7" stroke-width="6" opacity="0.6"/>
      <path d="M 160 40 L 220 200 L 280 260" fill="none" stroke="#0369a1" stroke-width="4" opacity="0.5"/>

      <!-- Stops -->
      <circle cx="100" cy="188" r="8" fill="#38bdf8"/>
      <circle cx="220" cy="200" r="10" fill="#10b981"/>
      <circle cx="340" cy="150" r="8" fill="#38bdf8"/>

      <!-- Live Bus Icon on Route -->
      <g transform="translate(260, 185)">
        <circle cx="0" cy="0" r="18" fill="#0284c7" stroke="#fff" stroke-width="2"/>
        <text x="0" y="6" fill="#fff" font-size="14" text-anchor="middle">🚌</text>
        <rect x="-35" y="-36" width="70" height="20" rx="10" fill="#0f172a"/>
        <text x="0" y="-23" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle" font-weight="bold">Bus 14-A (Live)</text>
      </g>
    </g>

    <!-- Right Side E-Ticket Pass -->
    <g transform="translate(520, 105)">
      <rect width="200" height="275" rx="12" fill="#0b3857" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="100" y="35" fill="#e0f2fe" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">E-Ticket Summary</text>
      
      <line x1="20" y1="50" x2="180" y2="50" stroke="#0284c7" stroke-dasharray="4 4"/>
      
      <text x="25" y="80" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11">Route:</text>
      <text x="25" y="98" fill="#fff" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">Central → Tech Park</text>

      <text x="25" y="130" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11">Next Arrival:</text>
      <text x="25" y="148" fill="#34d399" font-family="'Fira Code', monospace" font-size="14" font-weight="bold">3 Mins (On Time)</text>

      <!-- Barcode mockup -->
      <g transform="translate(25, 185)" fill="#e0f2fe">
        <rect x="0" y="0" width="6" height="40"/>
        <rect x="10" y="0" width="3" height="40"/>
        <rect x="18" y="0" width="8" height="40"/>
        <rect x="30" y="0" width="4" height="40"/>
        <rect x="38" y="0" width="6" height="40"/>
        <rect x="50" y="0" width="2" height="40"/>
        <rect x="56" y="0" width="8" height="40"/>
        <rect x="70" y="0" width="4" height="40"/>
        <rect x="80" y="0" width="7" height="40"/>
        <rect x="94" y="0" width="3" height="40"/>
        <rect x="102" y="0" width="10" height="40"/>
        <rect x="118" y="0" width="4" height="40"/>
        <rect x="126" y="0" width="6" height="40"/>
        <rect x="138" y="0" width="8" height="40"/>
      </g>
      <text x="100" y="245" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">PDF Ticket Ready</text>
    </g>
  </g>
</svg>
