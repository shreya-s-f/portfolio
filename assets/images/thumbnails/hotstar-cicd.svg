<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHotstar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="glowHotstar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="nodeActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgHotstar)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Mockup Window Frame -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="700" height="370" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="50" y="40" width="700" height="44" rx="16" fill="#1e293b"/>
    <rect x="50" y="68" width="700" height="16" fill="#1e293b"/>
    <circle cx="80" cy="62" r="6" fill="#ef4444"/>
    <circle cx="102" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="124" cy="62" r="6" fill="#10b981"/>
    
    <text x="400" y="67" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="13" text-anchor="middle" font-weight="600">
      Jenkins CI/CD Pipeline • Hotstar Deployment
    </text>

    <!-- Pipeline Status Header -->
    <rect x="80" y="105" width="640" height="46" rx="8" fill="#1e293b" opacity="0.6"/>
    <circle cx="105" cy="128" r="7" fill="#10b981"/>
    <text x="124" y="133" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="15" font-weight="700">Pipeline #42: SUCCESS</text>
    <rect x="610" y="116" width="90" height="24" rx="12" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="655" y="132" fill="#34d399" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle" font-weight="600">STABLE</text>

    <!-- Pipeline Stage Flow -->
    <!-- Connecting Line -->
    <line x1="140" y1="210" x2="660" y2="210" stroke="#334155" stroke-width="4"/>
    <line x1="140" y1="210" x2="660" y2="210" stroke="url(#glowHotstar)" stroke-width="4" stroke-dasharray="12 4"/>

    <!-- Stage 1: GitHub Webhook -->
    <g transform="translate(140, 210)">
      <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="22" fill="#0284c7"/>
      <text x="0" y="6" fill="#fff" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">GH</text>
      <text x="0" y="48" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Source</text>
      <text x="0" y="64" fill="#64748b" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Webhook</text>
    </g>

    <!-- Stage 2: Maven Build -->
    <g transform="translate(290, 210)">
      <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="22" fill="#d97706"/>
      <text x="0" y="6" fill="#fff" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">MVN</text>
      <text x="0" y="48" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Build</text>
      <text x="0" y="64" fill="#64748b" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Artifact .war</text>
    </g>

    <!-- Stage 3: Jenkins Test -->
    <g transform="translate(440, 210)">
      <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#ef4444" stroke-width="2.5" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="22" fill="#dc2626"/>
      <text x="0" y="6" fill="#fff" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">JEN</text>
      <text x="0" y="48" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Throttle</text>
      <text x="0" y="64" fill="#64748b" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Concurrent QC</text>
    </g>

    <!-- Stage 4: Apache Tomcat Deploy -->
    <g transform="translate(590, 210)">
      <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="22" fill="#059669"/>
      <text x="0" y="6" fill="#fff" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">TC</text>
      <text x="0" y="48" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Deploy</text>
      <text x="0" y="64" fill="#64748b" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Tomcat 10</text>
    </g>

    <!-- Metrics Bar Footer -->
    <rect x="80" y="325" width="640" height="55" rx="10" fill="#1e293b" opacity="0.8"/>
    <text x="110" y="358" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12">Build Duration: <tspan fill="#34d399">1m 14s</tspan></text>
    <text x="320" y="358" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12">Throttle Limit: <tspan fill="#38bdf8">2 Active</tspan></text>
    <text x="520" y="358" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12">Branch: <tspan fill="#a78bfa">origin/main</tspan></text>
  </g>
</svg>
